language: python
python:
  - "2.7"
before_install:
  - sudo apt-get update -qq
  - sudo apt-get install -y python-dev libhdf5-serial-dev libnetcdf-dev liblapack-dev libblas-dev cython gfortran
install: 
  - "pip install numpy"
  - "pip install netCDF4"
  - "pip install scipy"
script: "py.test test/"
notifications:
  irc: "chat.freenode.net#renci"
